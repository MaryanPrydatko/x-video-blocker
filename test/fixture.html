<!doctype html>
<!-- Offline replica of X's timeline DOM (same data-testids the extension
     targets). Used by run-fixture.mjs for login-free smoke testing. -->
<html>
<head>
<meta charset="utf-8">
<title>fixture</title>
<style>
  body { margin: 0; background: #000; color: #e7e9ea; font: 15px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width: 600px; margin: 0 auto; border-left: 1px solid #2f3336; border-right: 1px solid #2f3336; }
  article { border-bottom: 1px solid #2f3336; padding: 12px 16px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #16181c; display: inline-block; vertical-align: top; }
  .body { display: inline-block; width: calc(100% - 52px); margin-left: 8px; }
  [data-testid="User-Name"] a { color: inherit; text-decoration: none; font-weight: 700; }
  [data-testid="User-Name"] .handle, time { color: #71767b; font-weight: 400; }
  [data-testid="tweetText"] { margin-top: 4px; }
  video { width: 100%; border-radius: 16px; margin-top: 12px; background: #16181c; }
</style>
</head>
<body>
<main>

  <article data-testid="tweet" id="text-post">
    <span class="avatar"></span>
    <div class="body">
      <div data-testid="User-Name">
        <a href="/sarachen">Sara Chen</a>
        <span class="handle">@sarachen</span> ·
        <a href="/sarachen/status/1001"><time>2h</time></a>
      </div>
      <div data-testid="tweetText">Hot take: reading long threads is still the best way to learn on here.</div>
    </div>
  </article>

  <article data-testid="tweet" id="video-post">
    <span class="avatar"></span>
    <div class="body">
      <div data-testid="User-Name">
        <a href="/wildclips">Wildlife Clips</a>
        <span class="handle">@wildclips</span> ·
        <a href="/wildclips/status/1002"><time>4h</time></a>
      </div>
      <div data-testid="tweetText">This eagle's dive is unreal 🦅 watch till the end</div>
      <div data-testid="videoComponent">
        <video muted autoplay loop playsinline
               src="data:video/mp4;base64,AAAA"></video>
      </div>
    </div>
  </article>

  <article data-testid="tweet" id="gif-post">
    <span class="avatar"></span>
    <div class="body">
      <div data-testid="User-Name">
        <a href="/memewatch">Meme Watch</a>
        <span class="handle">@memewatch</span> ·
        <a href="/memewatch/status/1003"><time>6h</time></a>
      </div>
      <div data-testid="tweetText">me opening x for "just five minutes"</div>
      <div data-testid="tweetGif">
        <video muted autoplay loop playsinline
               src="data:video/mp4;base64,AAAA"></video>
      </div>
    </div>
  </article>

</main>
</body>
</html>
